name: Update catalogue

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check the catalogue is reachable from GitHub
        run: |
          curl -sS -o /dev/null --max-time 30 -w "catalogue answered with HTTP %{http_code}\n" \
            "https://lavasaopac.christuniversity.in/cgi-bin/koha/opac-search.pl?idx=kw&q=atomic"

      - name: Crawl the catalogue
        run: python3 -I crawl_catalogue.py

      - name: Commit if changed
        run: |
          git add library-catalogue.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git -c user.name="Adon Dominic" -c user.email="71404040+adon27@users.noreply.github.com" commit -q -m "Catalogue update $(date +%F)"
          git push -q
